<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
  </defs>

  <!-- Leaf Mascot Icon -->
  <g>
    <!-- Leaf Body -->
    <path d="M 100,10 C 110,40 150,70 160,110 C 170,150 140,190 110,210 C 80,190 40,160 30,110 C 20,60 70,20 100,10 Z" 
          fill="url(#leafGradIcon)" stroke="#3f6212" stroke-width="4" />
    
    <path d="M 100,10 L 108,25 L 120,35 L 135,50 L 148,70 L 158,95 L 160,110 M 100,10 L 85,25 L 70,38 L 52,55 L 38,78 L 30,110" 
          fill="none" stroke="#4d7c0f" stroke-width="3" />
    
    <path d="M 100,25 Q 105,110 110,200" fill="none" stroke="#84cc16" stroke-width="3" stroke-linecap="round" />

    <!-- Eyes -->
    <ellipse cx="88" cy="90" rx="14" ry="20" fill="#ffffff" stroke="#1e290b" stroke-width="3" />
    <ellipse cx="88" cy="94" rx="8" ry="12" fill="#232d0c" />
    <circle cx="86" cy="88" r="4" fill="#ffffff" />

    <ellipse cx="124" cy="90" rx="14" ry="20" fill="#ffffff" stroke="#1e290b" stroke-width="3" />
    <ellipse cx="124" cy="94" rx="8" ry="12" fill="#232d0c" />
    <circle cx="122" cy="88" r="4" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 78,65 Q 88,60 98,65" fill="none" stroke="#232d0c" stroke-width="3" stroke-linecap="round" />
    <path d="M 114,65 Q 124,60 134,65" fill="none" stroke="#232d0c" stroke-width="3" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M 92,120 Q 106,135 120,120" fill="none" stroke="#1e290b" stroke-width="4" stroke-linecap="round" />

    <!-- Thumbs Up -->
    <path d="M 25,125 C 10,120 0,110 10,95 C 15,88 28,98 35,110 L 32,125 Z" fill="#ffffff" stroke="#3f6212" stroke-width="3" />
    <circle cx="10" cy="98" r="7" fill="#ffffff" stroke="#3f6212" stroke-width="3" />
  </g>
</svg>
